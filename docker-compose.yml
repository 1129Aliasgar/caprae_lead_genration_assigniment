# Local stack: the API, a MongoDB the seed writes to, and the Next.js frontend.
#
# Nothing here is required to run the app — `npm run dev` in each directory
# works against any reachable MongoDB. This is for reproducing a clean local
# environment, or for pointing the seed at a throwaway database.
#
# Usage:
#   docker compose up -d mongo     # database only
#   docker compose up -d           # everything
#   docker compose down            # stop, keeping volumes
#   docker compose down -v         # stop and delete the database
#
# Note on production: this file is for local development. The API deploys to
# Render and the frontend to Netlify — see the root README for the environment
# variables each needs.

services:
  mongo:
    image: mongo:7
    container_name: leadmatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The seed script connects immediately on `up`, so the API waits for this
      # rather than failing on a cold container.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadmatch-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: development
      # Service name resolves on the compose network — not localhost, which
      # would be the API container itself.
      MONGO_URI: mongodb://mongo:27017/leadgenration
      JWT_SECRET: change-me-before-anything-real
      JWT_EXPIRES_IN: 1d
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time, so the container image already
        # knows where the API is. Overridable for a staging deploy.
        NEXT_PUBLIC_API_URL: http://localhost:5000
    container_name: leadmatch-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo-data:
