name: CI

# Push and PR both trigger it. The push trigger is what makes the badge on the
# repo meaningful for a reviewer who only looks at the landing page.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. Without this a burst
# of pushes burns minutes on runs whose result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --ignore-scripts: bcrypt and mongoose ship native builds. Installing
      # them is only needed to run the app, not to typecheck it, and skipping
      # them keeps this job fast and immune to platform-specific build errors
      # that have nothing to do with the code under review.
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  seed:
    name: Seed + rank against a real database
    runs-on: ubuntu-latest

    # Every job here is typecheck, lint and build: shape assertions. None of
    # them can tell whether the pipeline is *numerically* correct, which is why
    # this job exists — it is the only check in the repo that does.
    #
    # Five of this project's bugs survived typecheck and lint:
    #   - finalScore was 0.000 for every lead (weight keys vs field names)
    #   - $in with a regex source string matched nothing inside $match
    #   - a required field inside a nested object broke registration
    #   - logout never consulted the blacklist
    #   - location anchoring never matched "new york, ny"
    needs: verify

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Seed a lead set containing engineering roles
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/leadmatch_test
          JWT_SECRET: ci-only-not-a-real-secret
          LOG_LEVEL: error
        # `--match` is what makes this a usable test seed.
        #
        # A plain `--limit=200` reads the *first* 200 rows of the dataset, which
        # are area supervisors, daycare teachers and retail associates. None of
        # them are software or DevOps roles, so the ranking check seeded that way
        # returned zero leads and failed for a reason that had nothing to do with
        # the ranking.
        #
        # 1500 rows read yields ~104 engineering leads, of which enough clear a
        # 100k salary floor to rank against. Costs ~31s of Hugging Face paging at
        # the default 900ms interval — most of this job is the seed waiting, not
        # the checks.
        run: npm run seed:leads -- --limit=1500 --match=engineer,developer

      - name: Start the API
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/leadmatch_test
          JWT_SECRET: ci-only-not-a-real-secret
          LOG_LEVEL: error
          PORT: "5000"
          SKIP_EXTRACTION: "1"
        # Backgrounded, and the job would hang here otherwise. Output goes to a
        # log file so a startup crash is readable from the job log on failure.
        run: |
          nohup npm run dev > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for the API to be ready
        run: |
          # Poll rather than sleep-a-fixed-amount: a fixed sleep either wastes
          # time on a fast machine or fails on a slow one, and neither failure
          # says anything useful.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/v1/health > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "API did not start in 60s. Log:"
          cat backend/api.log
          exit 1

      - name: Verify the pipeline ranks real leads
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/leadmatch_test
          JWT_SECRET: ci-only-not-a-real-secret
          LOG_LEVEL: error
          # Extraction is deterministic and in-process, so it needs no key and no
          # network. It runs for real here — the whole point of this job is to
          # exercise the path a user actually takes.
        run: npm run verify:pipeline

      - name: Show the API log
        if: failure()
        working-directory: backend
        run: cat api.log

      - name: Stop the API
        if: always()
        working-directory: backend
        # `|| true` because the verify step may already have killed it, and a
        # cleanup failure should not mask the real test result.
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi