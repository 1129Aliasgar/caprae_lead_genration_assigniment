name: CI

# Push and PR both trigger it. The push trigger is what makes the badge on the
# repo meaningful for a reviewer who only looks at the landing page.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. Without this a burst
# of pushes burns minutes on runs whose result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --ignore-scripts: bcrypt and mongoose ship native builds. Installing
      # them is only needed to run the app, not to typecheck it, and skipping
      # them keeps this job fast and immune to platform-specific build errors
      # that have nothing to do with the code under review.
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  seed:
    name: Seed + rank against a real database
    runs-on: ubuntu-latest

    # Every job here is typecheck, lint and build: shape assertions. None of
    # them can tell whether the pipeline is *numerically* correct, which is why
    # this job exists — it is the only check in the repo that does.
    #
    # Five of this project's bugs survived typecheck and lint:
    #   - finalScore was 0.000 for every lead (weight keys vs field names)
    #   - $in with a regex source string matched nothing inside $match
    #   - a required field inside a nested object broke registration
    #   - logout never consulted the blacklist
    #   - location anchoring never matched "new york, ny"
    needs: verify

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Seed a small lead set
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/leadmatch_test
          JWT_SECRET: ci-only-not-a-real-secret
          LOG_LEVEL: error
        run: npm run seed:leads -- --limit=200

      - name: Verify the pipeline ranks real leads
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/leadmatch_test
          JWT_SECRET: ci-only-not-a-real-secret
          LOG_LEVEL: error
          # Extraction calls OpenRouter. Skipped in CI because a free-tier key
          # is rate-limited to ~50 requests a day, and a shared key would make
          # the build fail for reasons unrelated to the code.
          #
          # The consequence is stated rather than hidden: CI proves the ranking
          # path, not the extraction path.
          SKIP_EXTRACTION: "1"
        run: npm run verify:pipeline